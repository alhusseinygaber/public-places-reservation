<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register – Public Places Reservation</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/register.css" />
    <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
</head>

<body>
    <div class="container">
        <header class="glass">
            <h1>Create Your Account</h1>
            <p>Join us to start reserving your favorite public places</p>
        </header>
        <form id="register-form" class="glass">
            <div class="form-grid">
                <div class="form-group">
                    <input type="text" id="first-name" name="firstName" placeholder="" required />
                    <label for="first-name">First Name</label>
                </div>
                <div class="form-group">
                    <input type="text" id="last-name" name="lastName" placeholder="" required />
                    <label for="last-name">Last Name</label>
                </div>
                <div class="form-group">
                    <input type="text" id="national-id" name="nationalId" placeholder="" required />
                    <label for="national-id">National ID</label>
                </div>
                <div class="form-group">
                    <input type="tel" id="phone" name="phone" placeholder="" required />
                    <label for="phone">Phone Number</label>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="" required />
                    <label for="email">Email</label>
                </div>
                <div class="form-group">
                    <input type="date" id="dob" name="dob" placeholder="" required />
                    <label for="dob">Date of Birth</label>
                </div>
                <div class="form-group">
                    <input type="text" id="nationality" name="nationality" placeholder="" required />
                    <label for="nationality">Nationality</label>
                </div>
                <div class="form-group">
                    <input type="text" id="address" name="address" placeholder="" required />
                    <label for="address">Address</label>
                </div>
                <div class="form-group">
                    <input type="text" id="postal-code" name="postalCode" placeholder="" required />
                    <label for="postal-code">Postal Code</label>
                </div>
                <div class="form-group">
                    <select id="user-type" name="userType" required>
                        <option value="">Select User Type</option>
                        <option value="visitor">Visitor</option>
                        <option value="employee">Employee</option>
                    </select>
                    <label for="user-type">User Type</label>
                </div>
                <div class="form-group">
                    <input type="password" id="password" name="password" placeholder="" required />
                    <label for="password">Password</label>
                    <div id="password-strength"></div>
                </div>
                <div class="form-group">
                    <input type="password" id="confirm-password" name="confirmPassword" placeholder="" required />
                    <label for="confirm-password">Confirm Password</label>
                </div>
            </div>
            <p id="error-msg"></p>
            <div class="button-group">
                <button type="submit" class="button">Create Account</button>
                <a href="login.html" class="button secondary">Return to Login</a>
            </div>
        </form>
        <footer class="glass">
            <label for="theme-toggle">Light Mode</label>
            <input type="checkbox" id="theme-toggle" />
        </footer>
    </div>
    <script src="../scripts/theme.js"></script>
    <script src="../scripts/api.js"></script>
    <script>
        // Password strength indicator
        const passwordInput = document.getElementById('password');
        const strengthIndicator = document.getElementById('password-strength');

        passwordInput.addEventListener('input', (e) => {
            const password = e.target.value;
            let strength = 0;

            if (password.length >= 8) strength++;
            if (password.match(/[a-z]+/)) strength++;
            if (password.match(/[A-Z]+/)) strength++;
            if (password.match(/[0-9]+/)) strength++;
            if (password.match(/[$@#&!]+/)) strength++;

            strengthIndicator.className = '';
            if (strength === 0) {
                strengthIndicator.textContent = '';
            } else if (strength <= 2) {
                strengthIndicator.textContent = '🔴 Weak password';
                strengthIndicator.className = 'weak';
            } else if (strength <= 4) {
                strengthIndicator.textContent = '🟡 Medium password';
                strengthIndicator.className = 'medium';
            } else {
                strengthIndicator.textContent = '🟢 Strong password';
                strengthIndicator.className = 'strong';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'none';

            // Gather form data
            const formData = {
                firstName: document.getElementById('first-name').value,
                lastName: document.getElementById('last-name').value,
                nationalId: document.getElementById('national-id').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                dob: document.getElementById('dob').value,
                nationality: document.getElementById('nationality').value,
                address: document.getElementById('address').value,
                postalCode: document.getElementById('postal-code').value,
                userType: document.getElementById('user-type').value,
                password: document.getElementById('password').value
            };

            const confirmPassword = document.getElementById('confirm-password').value;
            if (formData.password !== confirmPassword) {
                errorMsg.textContent = "❌ Passwords do not match";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const result = await API.register(formData);
                if (result.token) {
                    API.setToken(result.token);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    alert('✅ Registration successful!');
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                errorMsg.textContent = '❌ ' + err.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
