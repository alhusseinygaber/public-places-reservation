<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us – Public Places Reservation</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/contact.css" />
    <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
</head>

<body>
    <div class="container">
        <header class="glass" style="text-align:center; margin-top:2rem;">
            <h1>Contact Us</h1>
            <p>Have a question or complaint? We're here to help.</p>
        </header>

        <!-- Navbar injected here by navbar.js -->
        <nav id="dynamic-nav" class="glass" style="display:flex; justify-content:center; gap:1rem; margin:2rem 0;">
        </nav>

        <form id="contact-form" class="glass" style="padding:2rem; max-width:600px; margin:auto;">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required />
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required />
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required
                    style="width:100%; padding:0.5rem; border-radius:6px; background:var(--color-surface); color:var(--color-text); border:none;"></textarea>
            </div>
            <button type="submit" class="button" style="margin-top:1rem; width:100%;">Send Message</button>
            <p id="feedback-msg" style="text-align:center; display:none; margin-top:1rem;"></p>
        </form>

        <footer class="glass" style="text-align:center; margin-top:2rem; padding:1rem;">
            <label for="theme-toggle">Light Mode</label>
            <input type="checkbox" id="theme-toggle" />
        </footer>
    </div>
    <script src="../scripts/theme.js"></script>
    <script src="../scripts/api.js"></script>
    <script src="../scripts/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Auto-fill if logged in
            const token = API.getToken();
            if (token) {
                try {
                    const user = await API.getProfile();
                    document.getElementById('name').value = `${user.firstName} ${user.lastName}`;
                    document.getElementById('email').value = user.email;
                    // Store userId in form dataset for submission
                    document.getElementById('contact-form').dataset.userId = user.id;
                } catch (e) { console.error(e); }
            }
        });

        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById('feedback-msg');
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value,
                userId: e.target.dataset.userId || null
            };

            try {
                // Using generic request but we didn't add contact to api.js explicitly yet
                // We can add it or just use fetch here. Let's use fetch for raw simplicity or add to api object.
                // Better to add to api.js? Let's assume we use raw fetch for this specific new route 
                // OR better engineering: stick to API generic handler
                const res = await fetch('http://localhost:3000/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.success) {
                    msgEl.textContent = 'Message sent successfully!';
                    msgEl.style.color = '#48bb78';
                    msgEl.style.display = 'block';
                    e.target.reset();
                } else {
                    throw new Error(result.error || 'Failed');
                }
            } catch (err) {
                msgEl.textContent = 'Error sending message. Try again.';
                msgEl.style.color = 'red';
                msgEl.style.display = 'block';
            }
        });
    </script>
</body>

</html>
