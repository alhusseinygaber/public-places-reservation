<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register – Public Places Reservation</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/register.css" />
    <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
</head>

<body>
    <div class="container">
        <header class="glass" style="text-align:center; margin-top:2rem;">
            <h1>Create Your Account</h1>
        </header>
        <form id="register-form" class="glass" style="padding:2rem; max-width:500px; margin:auto;">
            <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="firstName" required />
            </div>
            <div class="form-group">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="lastName" required />
            </div>
            <div class="form-group">
                <label for="national-id">National ID</label>
                <input type="text" id="national-id" name="nationalId" required />
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required />
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required />
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required />
            </div>
            <div class="form-group">
                <label for="nationality">Nationality</label>
                <input type="text" id="nationality" name="nationality" required />
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required />
            </div>
            <div class="form-group">
                <label for="postal-code">Postal Code</label>
                <input type="text" id="postal-code" name="postalCode" required />
            </div>
            <div class="form-group">
                <label for="user-type">User Type</label>
                <select id="user-type" name="userType" required>
                    <option value="visitor">Visitor</option>
                    <option value="employee">Employee</option>
                </select>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required />
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirmPassword" required />
            </div>
            <button type="submit" class="button">Create Account</button>
            <a href="login.html" class="button" style="margin-left:1rem;">Return to Login</a>
            <p id="error-msg" style="color:red; text-align:center; display:none; margin-top:1rem;"></p>
        </form>
        <footer class="glass" style="text-align:center; margin-top:2rem; padding:1rem;">
            <label for="theme-toggle">Light Mode</label>
            <input type="checkbox" id="theme-toggle" />
        </footer>
    </div>
    <script src="../scripts/theme.js"></script>
    <script src="../scripts/api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'none';

            // Gather form data
            const formData = {
                firstName: document.getElementById('first-name').value,
                lastName: document.getElementById('last-name').value,
                nationalId: document.getElementById('national-id').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                dob: document.getElementById('dob').value,
                nationality: document.getElementById('nationality').value,
                address: document.getElementById('address').value,
                postalCode: document.getElementById('postal-code').value,
                userType: document.getElementById('user-type').value,
                password: document.getElementById('password').value
            };

            const confirmPassword = document.getElementById('confirm-password').value;
            if (formData.password !== confirmPassword) {
                errorMsg.textContent = "Passwords do not match";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const result = await API.register(formData);
                if (result.token) {
                    API.setToken(result.token);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    alert('Registration successful!');
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
